    <meta property="og:title" content="AfriTrade Trust - Pan-African Business Discovery & B2B Marketplace" />
    <meta property="og:description" content="Trusted mobile-first African business discovery platform with verified company registrations, WhatsApp-first commercial enquiries, pan-African B2B trade readiness, and multilingual AI search." />

    <script>
      // Suppress dev WebSocket disconnect noise in cloud iframe/proxy environments
      (function() {
        const _origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => (a && (a.message || a.stack)) || String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('vite-hmr') || str.includes('closed without opened')) {
            return;
          }
          _origError.apply(console, args);
        };
        const _origWarn = console.warn;
        console.warn = function(...args) {
          const str = args.map(a => (a && (a.message || a.stack)) || String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('vite-hmr') || str.includes('closed without opened')) {
            return;
          }
          _origWarn.apply(console, args);
        };
      })();
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        const reasonStr = String((e && (e.reason && (e.reason.message || e.reason))) || '');
        if (reasonStr.includes('WebSocket') || reasonStr.includes('closed without opened')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
